name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  simulation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: pip install -r sim/requirements.txt
      - name: Installer gcc (pour le test croisé C/Python)
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Tests (simulation + validation croisée C/Python)
        run: pytest tests/ -v

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer la toolchain ARM
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - name: Compiler le firmware
        working-directory: firmware
        run: make
      - name: Publier le binaire
        uses: actions/upload-artifact@v4
        with:
          name: nanodrone_fc-elf
          path: firmware/build/nanodrone_fc.elf
